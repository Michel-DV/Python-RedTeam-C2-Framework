name: Publish portfolio release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Publish v2.1.0
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: bdd9d251f9fcba439d1008f406c1c434be4606dd
        run: |
          tag="v2.1.0"
          if ! git rev-parse "$tag" >/dev/null 2>&1; then
            git tag "$tag" "$TARGET_SHA"
            git push origin "$tag"
          fi
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --verify-tag --title "Python C2 Lab Simulator v2.1.0" --notes "Loopback-only controller/agent protocol simulator with strict framing and validation, explicit safe command dispatch, tests, CI, branch-coverage gating, and local demo assets."
          fi
